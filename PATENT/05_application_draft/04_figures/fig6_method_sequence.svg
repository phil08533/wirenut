<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" font-family="Arial" font-size="14" fill="none" stroke="black" stroke-width="1.3">

  <!-- ============ reusable assembly icon (nut + captive sleeve) ============ -->
  <defs>
    <g id="nutsleeve">
      <!-- cone -->
      <path d="M-14 0 Q0 -7 14 0 L22 74 L-22 74 Z"/>
      <!-- wings -->
      <path d="M-17 22 L-28 26 L-25 52 L-15 49"/>
      <path d="M17 22 L28 26 L25 52 L15 49"/>
      <!-- skirt -->
      <rect x="-24" y="74" width="48" height="14"/>
      <!-- tacked zone (thick) -->
      <line x1="-27" y1="74" x2="-27" y2="90" stroke-width="3"/>
      <line x1="27" y1="74" x2="27" y2="90" stroke-width="3"/>
      <!-- bell -->
      <path d="M-27 90 L-40 106 L-40 168"/>
      <path d="M27 90 L40 106 L40 168"/>
    </g>
  </defs>

  <!-- ============ FIG 6A: insertion ============ -->
  <g transform="translate(110,60)">
    <text x="-34" y="-22" fill="black" stroke="none" font-size="17">FIG. 6A</text>
    <use href="#nutsleeve"/>
    <!-- wires below, arrow up into bell -->
    <line x1="-8" y1="150" x2="-8" y2="260"/>
    <line x1="0" y1="150" x2="0" y2="260"/>
    <line x1="8" y1="152" x2="10" y2="262"/>
    <line x1="0" y1="130" x2="0" y2="150" stroke-width="0.8"/>
    <path d="M0 118 l-5 10 h10 z" fill="black" stroke="none"/>
    <text x="52" y="120" fill="black" stroke="none">44</text>
    <line x1="48" y1="116" x2="40" y2="120" stroke-width="0.8"/>
    <text x="52" y="210" fill="black" stroke="none">50</text>
    <line x1="48" y1="206" x2="12" y2="210" stroke-width="0.8"/>
    <text x="-70" y="40" fill="black" stroke="none">10</text>
    <line x1="-58" y1="36" x2="-24" y2="36" stroke-width="0.8"/>
  </g>

  <!-- ============ FIG 6B: rotation ============ -->
  <g transform="translate(320,60)">
    <text x="-34" y="-22" fill="black" stroke="none" font-size="17">FIG. 6B</text>
    <use href="#nutsleeve"/>
    <line x1="-6" y1="150" x2="-6" y2="260"/>
    <line x1="2" y1="150" x2="2" y2="260"/>
    <line x1="9" y1="152" x2="11" y2="262"/>
    <!-- rotation arrow around tip -->
    <path d="M-34 8 A38 20 0 1 1 -30 22" stroke-width="1"/>
    <path d="M-30 22 l-2 -9 l9 3 z" fill="black" stroke="none"/>
    <text x="52" y="40" fill="black" stroke="none">32</text>
    <line x1="48" y1="36" x2="27" y2="38" stroke-width="0.8"/>
  </g>

  <!-- ============ FIG 6C: heat ============ -->
  <g transform="translate(530,60)">
    <text x="-34" y="-22" fill="black" stroke="none" font-size="17">FIG. 6C</text>
    <use href="#nutsleeve"/>
    <line x1="-6" y1="150" x2="-6" y2="260"/>
    <line x1="2" y1="150" x2="2" y2="260"/>
    <line x1="9" y1="152" x2="11" y2="262"/>
    <!-- heat source 110: torch nozzle + flame at bell -->
    <rect x="72" y="118" width="46" height="18"/>
    <path d="M72 127 L58 127" stroke-width="1"/>
    <path d="M58 121 Q44 127 58 133 Q50 127 58 121 Z" fill="black" stroke="none"/>
    <path d="M56 127 Q46 122 42 127 Q46 132 56 127" stroke-width="1"/>
    <text x="126" y="132" fill="black" stroke="none">110</text>
    <!-- heat wiggle lines toward sleeve -->
    <path d="M46 118 q-4 -6 0 -12 M46 148 q-4 6 0 12" stroke-width="0.8"/>
  </g>

  <!-- ============ FIG 6D: sealed ============ -->
  <g transform="translate(730,60)">
    <text x="-34" y="-22" fill="black" stroke="none" font-size="17">FIG. 6D</text>
    <!-- nut -->
    <path d="M-14 0 Q0 -7 14 0 L22 74 L-22 74 Z"/>
    <path d="M-17 22 L-28 26 L-25 52 L-15 49"/>
    <path d="M17 22 L28 26 L25 52 L15 49"/>
    <rect x="-24" y="74" width="48" height="14"/>
    <!-- recovered sleeve tapering onto wires -->
    <path d="M-27 74 C-27 100 -12 112 -10 124 L-10 168" stroke-width="2.2"/>
    <path d="M27 74 C27 100 12 112 10 124 L10 168" stroke-width="2.2"/>
    <!-- wires -->
    <line x1="-6" y1="168" x2="-6" y2="260"/>
    <line x1="1" y1="168" x2="1" y2="260"/>
    <line x1="7" y1="168" x2="8" y2="260"/>
    <text x="52" y="120" fill="black" stroke="none">60</text>
    <line x1="48" y1="116" x2="14" y2="118" stroke-width="0.8"/>
  </g>
</svg>
