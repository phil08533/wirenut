<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" font-family="Arial" font-size="15" fill="none" stroke="black" stroke-width="1.5">
  <text x="180" y="28" fill="black" stroke="none" font-size="18">FIG. 4</text>
  <text x="130" y="50" fill="black" stroke="none" font-size="12">(enlarged fragmentary section, one wall of skirt)</text>

  <defs>
    <pattern id="hatch4" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="black" stroke-width="0.7"/>
    </pattern>
  </defs>

  <!-- shell wall fragment (vertical, cavity to the right) -->
  <path d="M180 80 L180 340 L215 340 L215 80 Z" fill="url(#hatch4)"/>
  <!-- break lines top and bottom -->
  <path d="M175 80 L185 74 L195 86 L205 74 L220 80" stroke-width="1"/>
  <path d="M175 340 L185 334 L195 346 L205 334 L220 340" stroke-width="1"/>

  <!-- annular retention formation 70: barb on outer (left) surface -->
  <!-- lead-in surface 72 (inclined, facing away from open end = upward here if open end is bottom) -->
  <!-- retention surface 74 (perpendicular, facing open end = downward) -->
  <path d="M180 150 L158 195 L180 195 Z" fill="url(#hatch4)"/>
  <!-- emphasize surfaces -->
  <line x1="180" y1="150" x2="158" y2="195" stroke-width="2"/>
  <line x1="158" y1="195" x2="180" y2="195" stroke-width="2"/>

  <!-- extended skirt 76 (lower band) -->
  <line x1="180" y1="260" x2="172" y2="260" stroke-width="1"/>
  <line x1="172" y1="260" x2="172" y2="340" stroke-width="1"/>

  <!-- sleeve first portion 42 engaged behind retention surface -->
  <path d="M150 120 L150 196 L156 196 L166 182 L156 158 L156 120 Z" stroke-width="2"/>
  <line x1="153" y1="124" x2="153" y2="192" stroke-dasharray="4 3" stroke-width="0.8"/>

  <!-- angle annotation on lead-in -->
  <path d="M180 165 A22 22 0 0 0 168 172" stroke-width="0.7"/>
  <text x="140" y="146" fill="black" stroke="none" font-size="12">30°–60°</text>

  <!-- labels -->
  <text x="300" y="110" fill="black" stroke="none">22</text>
  <line x1="296" y1="106" x2="216" y2="110"/>
  <text x="300" y="180" fill="black" stroke="none">70</text>
  <line x1="296" y1="176" x2="168" y2="178"/>
  <text x="86" y="160" fill="black" stroke="none">72</text>
  <line x1="104" y1="156" x2="167" y2="170"/>
  <text x="86" y="215" fill="black" stroke="none">74</text>
  <line x1="104" y1="211" x2="166" y2="196"/>
  <text x="86" y="110" fill="black" stroke="none">42</text>
  <line x1="104" y1="106" x2="149" y2="118"/>
  <text x="300" y="300" fill="black" stroke="none">76</text>
  <line x1="296" y1="296" x2="181" y2="300"/>
  <text x="300" y="345" fill="black" stroke="none">30</text>
  <line x1="296" y1="341" x2="216" y2="330"/>

  <!-- open-end direction arrow -->
  <line x1="250" y1="370" x2="250" y2="400" stroke-width="1"/>
  <path d="M250 400 l-4 -8 h8 z" fill="black" stroke="none"/>
  <text x="258" y="392" fill="black" stroke="none" font-size="12">toward open end 24</text>
</svg>
